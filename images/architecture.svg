<svg width="980" height="420" viewBox="0 0 980 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>CI/CD architecture: Developer to GitHub to Jenkins to Docker Registry to AWS EC2</title>
<desc>A developer pushes to GitHub, which triggers a webhook to Jenkins. Jenkins builds, tests, security-scans, builds a Docker image, pushes it to a registry, then deploys to an AWS EC2 instance running the application.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#8fb8e8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="980" height="420" fill="#0d1420"/>

<!-- nodes -->
<g font-family="Helvetica, Arial, sans-serif">

  <!-- Developer -->
  <rect x="30" y="160" width="120" height="70" rx="10" fill="#141b2b" stroke="#3a4a63"/>
  <text x="90" y="190" text-anchor="middle" font-size="13" font-weight="600" fill="#e6ecf5">Developer</text>
  <text x="90" y="208" text-anchor="middle" font-size="10.5" fill="#8b97ab">git push</text>

  <!-- GitHub -->
  <rect x="200" y="160" width="120" height="70" rx="10" fill="#141b2b" stroke="#3a4a63"/>
  <text x="260" y="190" text-anchor="middle" font-size="13" font-weight="600" fill="#e6ecf5">GitHub</text>
  <text x="260" y="208" text-anchor="middle" font-size="10.5" fill="#8b97ab">webhook</text>

  <!-- Jenkins -->
  <rect x="370" y="140" width="150" height="110" rx="10" fill="#1c2a41" stroke="#4f80c4" stroke-width="1.2"/>
  <text x="445" y="170" text-anchor="middle" font-size="13" font-weight="600" fill="#e6ecf5">Jenkins</text>
  <text x="445" y="190" text-anchor="middle" font-size="10.5" fill="#9db6d9">Build · Test</text>
  <text x="445" y="205" text-anchor="middle" font-size="10.5" fill="#9db6d9">SonarQube · Trivy</text>
  <text x="445" y="220" text-anchor="middle" font-size="10.5" fill="#9db6d9">OWASP Dep-Check</text>

  <!-- Docker Registry -->
  <rect x="570" y="60" width="160" height="70" rx="10" fill="#1c2a41" stroke="#4f80c4" stroke-width="1.2"/>
  <text x="650" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="#e6ecf5">Docker Registry</text>
  <text x="650" y="108" text-anchor="middle" font-size="10.5" fill="#9db6d9">Docker Hub / ECR</text>

  <!-- EC2 -->
  <rect x="570" y="230" width="160" height="90" rx="10" fill="#152219" stroke="#4f9f6f" stroke-width="1.2"/>
  <text x="650" y="258" text-anchor="middle" font-size="13" font-weight="600" fill="#e6ecf5">AWS EC2</text>
  <text x="650" y="276" text-anchor="middle" font-size="10.5" fill="#9dd9b6">docker run</text>
  <text x="650" y="292" text-anchor="middle" font-size="10.5" fill="#9dd9b6">latest image</text>

  <!-- Application -->
  <rect x="790" y="245" width="150" height="60" rx="10" fill="#152219" stroke="#4f9f6f" stroke-width="1.2"/>
  <text x="865" y="272" text-anchor="middle" font-size="13" font-weight="600" fill="#e6ecf5">Application</text>
  <text x="865" y="290" text-anchor="middle" font-size="10.5" fill="#9dd9b6">/healthz</text>

  <!-- arrows -->
  <line x1="150" y1="195" x2="198" y2="195" stroke="#8fb8e8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="195" x2="368" y2="195" stroke="#8fb8e8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M520 170 L650 170 L650 132" fill="none" stroke="#8fb8e8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="530" y="160" font-size="10.5" fill="#8fb8e8">docker push</text>

  <path d="M520 220 L650 220 L650 228" fill="none" stroke="#8fb8e8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="530" y="240" font-size="10.5" fill="#8fb8e8">ssh deploy</text>

  <line x1="730" y1="275" x2="788" y2="275" stroke="#8fb8e8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M650 130 Q650 90 650 90" fill="none"/>
</g>
</svg>
