<svg width="980" height="220" viewBox="0 0 980 220" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Jenkins pipeline stages</title>
<desc>Checkout, Build, Test, SonarQube analysis, OWASP Dependency Check, Trivy scan, Docker build, Docker push, Deploy, Health check, shown left to right.</desc>

<defs>
  <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#8fb8e8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="980" height="220" fill="#0d1420"/>

<g font-family="Helvetica, Arial, sans-serif" font-size="11.5">
  <!--
    9 stages across, evenly spaced.
    Box width 96, gap 12 => stride 108, start x = 15
  -->
</g>

<!-- Stage boxes generated with consistent geometry -->
<g font-family="Helvetica, Arial, sans-serif">
  <!-- 1 Checkout -->
  <rect x="15" y="90" width="96" height="50" rx="8" fill="#1c2a41" stroke="#4f80c4" stroke-width="1.1"/>
  <text x="63" y="120" text-anchor="middle" font-size="11.5" fill="#e6ecf5">Checkout</text>

  <!-- 2 Build -->
  <rect x="123" y="90" width="96" height="50" rx="8" fill="#1c2a41" stroke="#4f80c4" stroke-width="1.1"/>
  <text x="171" y="120" text-anchor="middle" font-size="11.5" fill="#e6ecf5">Build</text>

  <!-- 3 Test -->
  <rect x="231" y="90" width="96" height="50" rx="8" fill="#1c2a41" stroke="#4f80c4" stroke-width="1.1"/>
  <text x="279" y="120" text-anchor="middle" font-size="11.5" fill="#e6ecf5">Test</text>

  <!-- 4 SonarQube -->
  <rect x="339" y="90" width="96" height="50" rx="8" fill="#241c3f" stroke="#8f6fd9" stroke-width="1.1"/>
  <text x="387" y="114" text-anchor="middle" font-size="10.5" fill="#e6ecf5">SonarQube</text>
  <text x="387" y="128" text-anchor="middle" font-size="10.5" fill="#e6ecf5">Analysis</text>

  <!-- 5 OWASP -->
  <rect x="447" y="90" width="96" height="50" rx="8" fill="#241c3f" stroke="#8f6fd9" stroke-width="1.1"/>
  <text x="495" y="114" text-anchor="middle" font-size="10.5" fill="#e6ecf5">OWASP Dep-</text>
  <text x="495" y="128" text-anchor="middle" font-size="10.5" fill="#e6ecf5">Check</text>

  <!-- 6 Trivy -->
  <rect x="555" y="90" width="96" height="50" rx="8" fill="#241c3f" stroke="#8f6fd9" stroke-width="1.1"/>
  <text x="603" y="114" text-anchor="middle" font-size="10.5" fill="#e6ecf5">Trivy</text>
  <text x="603" y="128" text-anchor="middle" font-size="10.5" fill="#e6ecf5">FS + Image Scan</text>

  <!-- 7 Docker Build/Push -->
  <rect x="663" y="90" width="96" height="50" rx="8" fill="#1c2a41" stroke="#4f80c4" stroke-width="1.1"/>
  <text x="711" y="114" text-anchor="middle" font-size="10.5" fill="#e6ecf5">Docker Build</text>
  <text x="711" y="128" text-anchor="middle" font-size="10.5" fill="#e6ecf5">&amp; Push</text>

  <!-- 8 Deploy -->
  <rect x="771" y="90" width="96" height="50" rx="8" fill="#152219" stroke="#4f9f6f" stroke-width="1.1"/>
  <text x="819" y="120" text-anchor="middle" font-size="11.5" fill="#e6ecf5">Deploy</text>

  <!-- 9 Health check -->
  <rect x="879" y="90" width="90" height="50" rx="8" fill="#152219" stroke="#4f9f6f" stroke-width="1.1"/>
  <text x="924" y="114" text-anchor="middle" font-size="10.5" fill="#e6ecf5">Health</text>
  <text x="924" y="128" text-anchor="middle" font-size="10.5" fill="#e6ecf5">Check</text>

  <!-- connecting arrows -->
  <line x1="111" y1="115" x2="121" y2="115" stroke="#8fb8e8" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="219" y1="115" x2="229" y2="115" stroke="#8fb8e8" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="327" y1="115" x2="337" y2="115" stroke="#8fb8e8" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="435" y1="115" x2="445" y2="115" stroke="#8fb8e8" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="543" y1="115" x2="553" y2="115" stroke="#8fb8e8" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="651" y1="115" x2="661" y2="115" stroke="#8fb8e8" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="759" y1="115" x2="769" y2="115" stroke="#8fb8e8" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="867" y1="115" x2="877" y2="115" stroke="#8fb8e8" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- legend -->
  <rect x="15" y="180" width="12" height="12" rx="3" fill="#1c2a41" stroke="#4f80c4"/>
  <text x="33" y="190" font-size="10.5" fill="#8b97ab">Build stage</text>
  <rect x="130" y="180" width="12" height="12" rx="3" fill="#241c3f" stroke="#8f6fd9"/>
  <text x="148" y="190" font-size="10.5" fill="#8b97ab">Security stage</text>
  <rect x="265" y="180" width="12" height="12" rx="3" fill="#152219" stroke="#4f9f6f"/>
  <text x="283" y="190" font-size="10.5" fill="#8b97ab">Deploy stage</text>
</g>
</svg>
